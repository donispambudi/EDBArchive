name: edbarchive

services:
  mariadb:
    image: mariadb:12.1.2
    environment:
      MARIADB_DATABASE: ${EDB_DB_NAME:?EDB_DB_NAME must be set}
      MARIADB_USER: edbarchive
      MARIADB_PASSWORD: ${EDB_DB_PASSWORD:?EDB_DB_PASSWORD must be set}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${EDB_DB_HOST_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/01-grant.sql:/docker-entrypoint-initdb.d/01-grant.sql:ro
      - ./docker/mariadb/02-create-tpcc.sql:/docker-entrypoint-initdb.d/02-create-tpcc.sql:ro
      - ./docker/mariadb/03-load-tpcc.sh:/docker-entrypoint-initdb.d/03-load-tpcc.sh:ro
      - ./docker/mariadb/03-tpcc.sql.gz:/seed/tpcc.sql.gz:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  job-queue:
    build:
      context: .
      dockerfile: docker/job-queue/Dockerfile
      target: job-queue
    environment:
      EDB_WORKER_HOST: 0.0.0.0
      EDB_WORKER_PORT: ${EDB_WORKER_PORT:-9100}
      EDB_WORKER_POLL_INTERVAL: ${EDB_WORKER_POLL_INTERVAL:-60}
      EDB_DB_HOST: mariadb
      EDB_DB_PORT: 3306
      EDB_DB_NAME: ${EDB_DB_NAME:?EDB_DB_NAME must be set}
      EDB_DB_USER: edbarchive
      EDB_DB_PASSWORD: ${EDB_DB_PASSWORD:?EDB_DB_PASSWORD must be set}
      EDB_WORKSPACE_DIR: /app/storage
      EDB_FHE_WRAPPER: /app/backend/fhe_wrapper.sh
      EDB_RUNTIME_DIR: /run/edbarchive
    expose:
      - "${EDB_WORKER_PORT:-9100}"
    volumes:
      - edbarchive-storage:/app/storage
    tmpfs:
      - /run/edbarchive:mode=0700
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket; s = socket.create_connection(('127.0.0.1',
          int(__import__('os').environ['EDB_WORKER_PORT'])), 2);
          s.sendall(b'HEALTH\n'); raise SystemExit(0 if
          s.recv(32).startswith(b'OK') else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  third-party:
    profiles:
      - third-party
    image: edbarchive-third-party
    build:
      context: .
      dockerfile: docker/job-queue/Dockerfile
      target: third-party

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    env_file:
      - ./web/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${EDB_DB_NAME:?EDB_DB_NAME must be set}
      DB_USERNAME: edbarchive
      DB_PASSWORD: ${EDB_DB_PASSWORD:?EDB_DB_PASSWORD must be set}
      EDB_WORKER_HOST: job-queue
      EDB_WORKER_PORT: ${EDB_WORKER_PORT:-9100}
    ports:
      - "127.0.0.1:${EDB_WEB_PORT:-8000}:80"
    volumes:
      - edbarchive-storage:/var/www/html/storage/app
    depends_on:
      mariadb:
        condition: service_healthy
      job-queue:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb-data:
  edbarchive-storage:
